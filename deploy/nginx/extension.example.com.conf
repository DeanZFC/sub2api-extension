# 此配置安装在独立的 Nginx 服务器上。把下方
# EXTENSION_SERVER_PRIVATE_IP 替换为扩展部署服务器的内网 IP，
# 并把 extension.example.com 替换为实际扩展域名。
# 首次启用时这是 HTTP 配置。执行
# certbot --nginx --redirect -d extension.example.com
# 后，Certbot 会在本文件中添加证书和 HTTPS 配置。
server {
    listen 80;
    listen [::]:80;
    server_name extension.example.com;

    # 登录入口包含 Sub2API 短期令牌，不能写入 Nginx 访问日志。
    access_log off;

    client_max_body_size 1m;

    # 生产环境永远不开放本地测试入口。
    location ^~ /local-test/ {
        return 404;
    }

    location / {
        proxy_pass http://EXTENSION_SERVER_PRIVATE_IP:18084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
